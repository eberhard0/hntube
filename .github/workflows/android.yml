name: Android

# Every push to main / workflow_dispatch: build the signed release APK (falls back to a
# debug-signed APK when no upload key is configured, so it can still be sideloaded).
# Every v* tag: build the signed APK and attach it to a GitHub Release.
#
# Signing needs four repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
# (set with ~/hindsight-keys/set-github-secrets.sh, REPO=eberhard0/hntube).
# The build reads them from a signing.properties written below; without them, a debug APK is built.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # attach build outputs to the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-37.0
            build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore and write signing.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > signing.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          # Without the upload key the release APK is unsigned (not installable);
          # build a debug-signed one as well so it can still be sideloaded.
          if [ ! -f signing.properties ]; then ./gradlew --no-daemon assembleDebug; fi

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hntube
          retention-days: 7
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
